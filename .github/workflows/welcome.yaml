name: ci/cd pipeline
on:
  push:
    branches: 
      - main
      - develop*
      - 'release/**'
  pull_request: 
    types: 
      - opened
    branches: 
      - main    
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check out repo code
        run: |
            npm install 
      - name: print variable
        run: echo "name is ${{vars.NAME}}"   
      - name: print secret
        run: echo "secret is ${{secrets.DOCKER_PASSWORD}}"    
 
