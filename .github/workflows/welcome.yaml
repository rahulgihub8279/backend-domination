name: ci/cd pipeline
on:
  push:
    branches: [main]  
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out repo code
        run: |
          echo "this is checkout step"
          uname -a
          pwd
          ls -l
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: install npm
        run: npm install
      - name: testing 
        run: npm run test  
      - name: check the testing
        run: echo "test ok"      
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: deploy the code
        run: node -v      
    
  
